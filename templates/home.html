<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>My Flask App</title>
</head>

<body>
    <h1> 🚧 Welcome to Dusty Digger 🚧  </h1>
    <p>Dusty digging for deep nuggets. Pick a song and how you'd like to dig.</p>
    <form action="/" method="post">
        <label for="song_name">What song would you like to dig:</label><br>
        <input type="text" id="song_name" name="song_name"><br>
        <label for="artist_name">And by which artist?:</label><br>
        <input type="text" id="artist_name" name="artist_name" list="artist_list" autocomplete="off"><br>
        <datalist id="artist_list"></datalist>
        Dig by:
        <input type="radio" id="mode_label" name="mode" value="label" checked><label for="mode_label">label</label> <small>(same label, same era)</small>
        <input type="radio" id="mode_uploader" name="mode" value="uploader"><label for="mode_uploader">uploader</label> <small>(same YouTube channel)</small><br>
        <input type="submit" value="Submit">
    </form>

    <div id="digging" style="display:none">
        <hr>
        <pre id="digger"></pre>
        <p><b id="dig-msg">digging...</b> <span id="dig-time"></span></p>
        <p><small>this can take up to half a minute. don't close the page.</small></p>
    </div>

    <script>
    (function () {
        var input = document.getElementById("artist_name"), list = document.getElementById("artist_list");
        var timer = null, cache = {};
        function fill(names) {
            list.innerHTML = "";
            names.forEach(function (n) { var o = document.createElement("option"); o.value = n; list.appendChild(o); });
        }
        input.addEventListener("input", function () {
            var q = input.value.trim();
            clearTimeout(timer);
            if (q.length < 2) { fill([]); return; }
            if (cache[q.toLowerCase()]) { fill(cache[q.toLowerCase()]); return; }
            timer = setTimeout(function () {
                fetch("/artists?q=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (names) {
                    cache[q.toLowerCase()] = names;
                    if (input.value.trim() === q) fill(names);
                }).catch(function () {});
            }, 300);
        });
    })();
    </script>

    <script>
    (function () {
        // A little excavator digging a hole and dumping the dirt on a pile.
        var CAB = [
            "   ______      ",
            "  | [] | |     ",
            " _|____|_|____ ",
            "|_____________|",
            " (o)(o)(o)(o)  "
        ];
        var ARMS = [
            ["      ____           ", "    _/    \\          ", "  _/      [_]        ", "_/                   ", "                     "],
            ["                     ", "                     ", "  ____               ", "_/    \\__            ", "         [_]         "],
            ["                     ", "     ___             ", "  __/   \\            ", "_/      [#]          ", "                     "],
            ["      ___________    ", "    _/           \\   ", "  _/              [#]", "_/                 : ", "                   . "]
        ];
        var frame = 0, loads = 0, started = 0, timers = [];
        var MSGS = {
            label: ["looking up your song on Discogs...", "finding the label that first put it out...",
                    "pulling records from the same era...", "lining up the YouTube videos..."],
            uploader: ["finding your song on YouTube...", "finding who posted it...",
                       "digging through their uploads...", "sorting the good stuff to the top..."]
        };
        function draw() {
            var arm = ARMS[frame % 4];
            var pile = Math.min(1 + Math.floor(loads / 3), 2);
            var lines = [];
            for (var i = 0; i < 5; i++) {
                var row = CAB[i] + arm[i];
                if (i >= 5 - pile) {
                    var k = i - (5 - pile), col = 34 - k;  // a heap centred under where the bucket drops
                    while (row.length < col) row += " ";
                    row = row.slice(0, col) + new Array(2 * k + 2).join(":");
                }
                lines.push(row);
            }
            var ground = "~~~~~~~~~~~~~~~~~~~~~~~\\___/~~~~~~~~~";
            lines.push(ground);
            lines.push("  /!\\ CONSTRUCTION SITE /!\\");
            document.getElementById("digger").textContent = lines.join("\n");
            frame++;
            if (frame % 4 === 0) loads++;
        }
        function start(mode) {
            started = Date.now(); frame = 0; loads = 0;
            document.getElementById("digging").style.display = "";
            document.querySelector("form").style.display = "none";
            var msgs = MSGS[mode] || MSGS.label, m = 0;
            document.getElementById("dig-msg").textContent = msgs[0];
            draw();
            timers.push(setInterval(draw, 450));
            timers.push(setInterval(function () {
                var secs = Math.round((Date.now() - started) / 1000);
                document.getElementById("dig-time").textContent = "(" + secs + "s)";
            }, 1000));
            timers.push(setInterval(function () {
                m = Math.min(m + 1, msgs.length - 1);
                document.getElementById("dig-msg").textContent = msgs[m];
            }, 4000));
        }
        function stop() {
            timers.forEach(clearInterval); timers = [];
            document.getElementById("digging").style.display = "none";
            document.querySelector("form").style.display = "";
        }
        document.querySelector("form").addEventListener("submit", function () {
            var picked = document.querySelector("input[name=mode]:checked");
            var song = document.getElementById("song_name").value.trim(), artist = document.getElementById("artist_name").value.trim();
            if (song || artist) start(picked ? picked.value : "label");
        });
        // Coming back with the back button: show the form again, not a frozen digger.
        window.addEventListener("pageshow", function (e) { if (e.persisted) stop(); });
        window.diggerPreview = start;
    })();
    </script>
</body>

</html>
